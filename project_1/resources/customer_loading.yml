resources:
  jobs:
    customer_loading:
      name: customer_loading
      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 1
          unit: DAYS
      tasks:
        - task_key: customers
          notebook_task:
            notebook_path: /Repos/waghbk020801@gmail.com/databricks-first-proj/project_1/src/bronze_notebooks/01_bronze_customers
            source: WORKSPACE
        - task_key: customers_silver
          depends_on:
            - task_key: customers
          notebook_task:
            notebook_path: /Repos/waghbk020801@gmail.com/databricks-first-proj/project_1/src/silver_notebooks/03_silver_customers
            source: WORKSPACE
          environment_key: default
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
