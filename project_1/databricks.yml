# This is a Declarative Automation Bundle definition for project_1.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: project_1
  uuid: 2b63e0ad-2c0a-4011-9793-3e8993f3aef9

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-5b9d2cfb-bed6.cloud.databricks.com
      root_path: /Workspace/Users/waghbk020801@gmail.com/dev
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  
  uat:
    mode: production
    workspace:
      host: https://dbc-5b9d2cfb-bed6.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/waghbk020801@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/waghbk020801@gmail.com/uat
    variables:
      catalog: workspace
      schema: uat
    permissions:
      - user_name: waghbk020801@gmail.com
        level: CAN_MANAGE

  
  prod:
    mode: production
    workspace:
      host: https://dbc-5b9d2cfb-bed6.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/waghbk020801@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/waghbk020801@gmail.com/prod
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: waghbk020801@gmail.com
        level: CAN_MANAGE
